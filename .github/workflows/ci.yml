name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      # Both floors are load-bearing and neither is checked by anything else.
      #
      # 22.16 is the exact version package.json's `engines` demands, and the
      # first run of this workflow is why it says 22.16 rather than 22.13.
      # node:sqlite stopped needing a flag in 22.13, so that was the floor --
      # but its backup(), which every write snapshots through, only arrived
      # in 22.16, and nothing had ever run there to notice. Declaring a floor
      # without running on it is a guess.
      #
      # Ubuntu is here because development happens on macOS and the library
      # discovery walks /Volumes, which does not exist elsewhere. The code
      # handles that and the tests skip around it, but "handles it" is worth
      # proving on a machine that actually lacks the directory.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.16", "24"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # `npm test` runs `pretest` -> `tsc` first, so a type error fails here
      # rather than at publish time.
      #
      # The performance budgets are excluded. They assert wall-clock times
      # against a baseline measured on a developer machine, and a shared
      # runner of unknown speed sharing a host with unknown neighbours cannot
      # produce a number that means anything about this code. They stay a
      # local gate; see the comment in tests/performance-budget.test.ts.
      - run: npm test -- --exclude '**/performance-budget.test.ts'

  package:
    # Publishing is manual and 2FA-gated, but what would be published should
    # still be checked on every push: a tarball that has lost dist/, or grown
    # the test fixtures, is a broken release found after the fact otherwise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16"
          cache: npm
      - run: npm ci

      - name: The tarball carries dist/ and nothing from tests/
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -q "dist/index.js" /tmp/pack.txt || { echo "dist/ missing from the tarball"; exit 1; }
          if grep -qE "tests/|fixtures/|\.bin$" /tmp/pack.txt; then
            echo "test files leaked into the tarball"; exit 1
          fi
